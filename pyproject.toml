[project]
name = "merchant-support-agent"
version = "0.1.0"
description = "AI support agent for Google Shopping merchants, with human handoff and evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "pydantic>=2",
    "python-dotenv",
    "streamlit",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merchant_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
