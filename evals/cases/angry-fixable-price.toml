id = "angry-fixable-price"
category = "angry_merchant"
store = "price-only"
description = "Angry on the first message, but it's a plain data fix and the first attempt. Stay calm, explain, no handoff."
tags = ["automation_routing"]

[[turns]]
merchant = "Your stupid system disapproved my towel for no reason. Fix it NOW."

[expect]
must_mention = ['''automatic(ally)?\b.{0,30}updat''', '''(turn|switch)(ing)? (it |them |this |that )?on|enabl''']
