id = "auto-off-both-kinds"
category = "automation_routing"
store = "v2-mismatch-off"
description = "Item updates are off, with one price and one availability mismatch. Recommend item updates for both, and still give the manual fix."
tags = ["tool_calls"]

[[turns]]
merchant = "Two of my listings were pulled. What happened and how do I stop it recurring?"

[expect]
should_handoff = false
must_cite = ["automatic-item-updates", "price-mismatch", "availability-mismatch"]
must_mention = ['''automatic(ally)?\b.{0,30}updat''', '''(turn|switch)(ing)? (it |them |this |that )?on|enabl''', '''HG-060|teapot''', '''HG-061|planter''']
must_not_say = ['''CASE-\d''']

[[expect.must_call]]
tool = "get_automatic_improvements"
