id = "warnings-gtin-only"
category = "warnings"
store = "gtin-only"
description = "Only missing GTINs: warnings, no disapprovals. The agent must not call them disapproved."

[[turns]]
merchant = "Are any of my products disapproved?"

[expect]
should_handoff = false
must_cite = ["gtin"]
must_mention = ['''(limited|fewer|reduced|less|lower)[- ](reach|visibility|shoppers|exposure)|still (show|appear|be shown|visible)|\bdemoted\b|\blimits? (their|its|the) (reach|visibility)''']
must_not_say = ['''\b(2|two) (of your )?products? (are|were|have been) disapproved''', '''CASE-\d''']
