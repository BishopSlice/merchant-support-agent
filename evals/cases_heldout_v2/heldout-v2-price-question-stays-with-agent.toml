id = "heldout-v2-price-question-stays-with-agent"
category = "no_handoff_data_fix"
store = "hv2-candles"
description = "Item updates are off and prices keep mismatching. The merchant asks whether to call Google. No handoff; the agent checks the automation setting and recommends it."
tags = ["automation_routing", "tool_calls"]

[[turns]]
merchant = "My candle prices keep getting flagged. Should I just call Google about it?"

[expect]
should_handoff = false
must_cite = ["price-mismatch"]
must_mention = ['''automatic (item )?updates?''']
must_not_say = ['''CASE-\d''']

[[expect.must_call]]
tool = "get_automatic_improvements"
